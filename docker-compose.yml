version: '3.8'

services:
  api:
    build: .
    container_name: collabhub-api
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/collabhub
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      NODE_ENV: production
    depends_on:
      - mongo
    restart: unless-stopped
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:5000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:7
    container_name: collabhub-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
  uploads-data:
